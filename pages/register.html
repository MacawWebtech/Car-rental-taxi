<script>
  /* Apply saved theme + language before first paint (no flash) */
  (function () {
    try {
      var t = localStorage.getItem('mobility-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', t);
      var l = localStorage.getItem('mobility-lang');
      if (l) { document.documentElement.lang = l; document.documentElement.dir = (l === 'ar' || l === 'he') ? 'rtl' : 'ltr'; }
      var d = localStorage.getItem('mobility-dir');
      if (d === 'rtl' || d === 'ltr') document.documentElement.dir = d;
    } catch (e) {}
  })();
</script>

<div id="preloader" class="preloader" role="status" aria-live="polite">

<main id="main" tabindex="-1" class="auth-wrap">
<div class="auth-visual">
  <img class="bg" src="../assets/images/outstation%20travel.jpg" sizes="100vw" alt="Car on an open highway at sunrise" width="1200" height="1400" decoding="async" fetchpriority="high">
  <a class="brand" href="index.html" aria-label="Kaarvan home"><img class="brand-logo" src="../assets/images/logo-light.png" alt="Kaarvan" width="364" height="120"></a>
  <div><h2>Your first ride starts here.</h2><p class="mt-3">Save places, split fares and get GST invoices automatically.</p></div>
  <figure class="auth-quote m-0"><blockquote class="mb-3">“Booked, tracked, invoiced — I haven't called a cab company in two years.”</blockquote><figcaption class="person"><img src="../assets/images/customer6.jpg" alt="Arjun Rao" width="48" height="48" loading="lazy" decoding="async"><div><strong>Arjun Rao</strong><span style="color:#B3B7BC">Pune · 212 trips</span></div></figcaption></figure>
</div>
<div class="auth-form"><div class="inner">
  <div class="d-flex justify-content-end gap-2 mb-4"><button class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">
  <i class="bi bi-moon-stars" aria-hidden="true"></i><i class="bi bi-sun" aria-hidden="true"></i>
</button></div>
  <h1>Create account</h1>
  <p class="text-muted">Already have one? <a href="login.html">Log in</a></p>
  <div class="social-login">
  <button class="btn btn-line" type="button" data-toast="Connect Google OAuth in your auth provider"><i class="bi bi-google me-2" aria-hidden="true"></i>Google</button>
  <button class="btn btn-line" type="button" data-toast="Connect Apple Sign In in your auth provider"><i class="bi bi-apple me-2" aria-hidden="true"></i>Apple</button>
</div>
  <div class="divider-text">or with email</div>
  <form data-validate-form data-redirect="../dashboard/index.html" action="/api/auth/register" method="post" class="d-grid gap-3">
    <div class="field"><label for="r-name">Full name</label><span class="field-icon" aria-hidden="true"><i class="bi bi-person"></i></span><input class="form-control" id="r-name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="r-email">Email</label><span class="field-icon" aria-hidden="true"><i class="bi bi-envelope"></i></span><input class="form-control" type="email" id="r-email" name="email" required autocomplete="email"></div>
    <div class="field"><label for="r-phone">Phone</label><span class="field-icon" aria-hidden="true"><i class="bi bi-phone"></i></span><input class="form-control" type="tel" id="r-phone" name="phone" required autocomplete="tel" placeholder="+91 98400 12345"></div>
    <div class="field"><label for="r-pw">Password</label><span class="field-icon" aria-hidden="true"><i class="bi bi-lock"></i></span><input class="form-control" type="password" id="r-pw" name="password" required data-validate="password" data-pw-meter="#pwm" autocomplete="new-password" aria-describedby="pw-hint">
      <button class="pw-toggle" type="button" aria-controls="r-pw" aria-pressed="false" aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
      <div class="pw-meter" id="pwm" aria-hidden="true"><span></span></div>
      <div class="d-flex justify-content-between small mt-1"><span class="text-muted" id="pw-hint">8+ characters, a letter and a number</span><span id="pwm-label" class="fw-bold" aria-live="polite"></span></div></div>
    <div class="field"><label for="r-pw2">Confirm password</label><span class="field-icon" aria-hidden="true"><i class="bi bi-lock-fill"></i></span><input class="form-control" type="password" id="r-pw2" name="password2" required data-match="#r-pw" autocomplete="new-password"></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" id="r-terms" name="terms" required><label class="form-check-label" for="r-terms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></label></div>
    <button class="btn btn-ink btn-lg" type="submit"><span class="btn-label">Create account</span></button>
  </form>
</div></div>
</main>
